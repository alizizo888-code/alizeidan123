name: Publish OXYGEN static SEO articles

on:
  schedule:
    - cron: "19 1 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات في هذا التشغيل"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

      generate_images:
        description: "إنشاء صورة AI للمقال (قد يستهلك رصيد API)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: oxygen-static-article-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate current published pages and sitemap
        run: python scripts/publish_static_articles.py --validate-only

      - name: Publish reviewed queue first or generate fresh articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_GENERATE_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_images || 'false' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          ARTICLE_COUNT: ${{ github.event.inputs.count || '1' }}
        run: python scripts/publish_static_articles.py --publish-queued "$ARTICLE_COUNT" --count "$ARTICLE_COUNT"

      - name: Commit the new articles, catalog, queue history and sitemap
        id: commit_articles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles sitemap.xml .github/article-queue
          if git diff --cached --quiet; then
            echo "No article changes to publish in this run."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          page_path="$(git diff --cached --name-only --diff-filter=A | grep -E '^articles/[^/]+/index[.]html$' | head -n 1 || true)"
          if [[ -z "$page_path" ]]; then
            page_path="$(git diff --cached --name-only | grep -E '^articles/[^/]+/index[.]html$' | head -n 1 || true)"
          fi
          if [[ -z "$page_path" ]]; then
            echo "::error::Could not determine the article page created by this run."
            exit 1
          fi
          slug="$(basename "$(dirname "$page_path")")"
          echo "article_url=https://oxygen11.com/articles/$slug/" >> "$GITHUB_OUTPUT"
          git commit -m "content: publish OXYGEN maintenance article batch"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify published article and sitemap are reachable on oxygen11.com
        if: steps.commit_articles.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          article_url="${{ steps.commit_articles.outputs.article_url }}"
          if [[ -z "$article_url" ]]; then
            echo "::error::No article URL was passed from the publishing step."
            exit 1
          fi
          article_ok=0
          for attempt in 1 2 3 4 5 6; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 25 -o "$body" -w '%{http_code}' "$article_url" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && [[ "$(wc -c < "$body" | tr -d ' ')" -gt 1500 ]] && grep -qi '<title>' "$body"; then
              echo "Published article is reachable: $article_url"
              article_ok=1
              rm -f "$body"
              break
            fi
            echo "Waiting for static hosting sync (attempt $attempt, HTTP $status)."
            rm -f "$body"
            sleep 10
          done
          if [[ "$article_ok" -ne 1 ]]; then
            echo "::error::The article was committed to GitHub but was not verified on the public website. Check Hostinger Git deployment/sync."
            exit 1
          fi

          sitemap="$(mktemp)"
          status="$(curl -sS -L --max-time 25 -o "$sitemap" -w '%{http_code}' 'https://oxygen11.com/sitemap.xml?deployment_check=1' || true)"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || ! grep -q '<urlset' "$sitemap"; then
            echo "::error::The sitemap was not verified on the public website (HTTP $status)."
            rm -f "$sitemap"
            exit 1
          fi
          echo "Sitemap is reachable."
          rm -f "$sitemap"
