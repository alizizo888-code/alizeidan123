name: Build Android apps

# Builds two installable Android apps (APK): the customer app and the operations-supervisor app.
# Both load the live site (https://oxygen11.com/app/) inside a native shell: always in sync with the website; offline.html shows when there is no connection. APKs are published on the
# "apps-latest" release so the download links inside the sites never change.
on:
  workflow_dispatch:
  push:
    branches: [oxygen]
    paths: ['native/**', '.github/workflows/build-apps.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [app, ops, deskops, deskctl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (preinstalled on the runner)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" > /dev/null || { echo "::error::no android sdk at $SDK"; exit 1; }
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Check the offline fallback page (the app itself loads the live site, always in sync and no stale bundle)
        working-directory: native/${{ matrix.app }}
        run: ls www && test -f www/offline.html && test -f www/index.html
      - name: Prepare Capacitor project
        working-directory: native/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          mkdir -p assets
          ICON=../../brand/oxygen/icon-512.png; [ -f icon-512.png ] && ICON=icon-512.png
          cp "$ICON" assets/icon-only.png
          cp "$ICON" assets/icon-foreground.png
          python3 - <<'PY'
          import zlib, struct
          w = h = 1024
          row = b'\x00' + bytes([0x0b, 0x12, 0x20]) * w
          raw = zlib.compress(row * h, 9)
          def chunk(t, d): c = struct.pack('>I', len(d)) + t + d; return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          open('assets/icon-background.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', raw) + chunk(b'IEND', b''))
          PY
          npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220' || true
          npx cap sync android
      - name: Permissions (microphone for the hotline, location for technicians, notifications)
        working-directory: native/${{ matrix.app }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS CAMERA VIBRATE; do
            grep -q "android.permission.$p" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" $M
          done
      - name: Build APK
        working-directory: native/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || { grep -E 'error|Error|FAILED|wrong|not found|What went' build.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:250}"; done; exit 1; }
      - name: Name the file
        run: |
          mkdir -p out
          cp native/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk out/oxygen-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oxygen-${{ matrix.app }}
          path: out/oxygen-${{ matrix.app }}.apk
      - name: Publish to the apps-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apps-latest >/dev/null 2>&1 || gh release create apps-latest --title "Oxygen apps (latest)" --notes "Android APKs: oxygen-app.apk (customers) and oxygen-ops.apk (operations supervisor)." --latest=false
          gh release upload apps-latest out/oxygen-${{ matrix.app }}.apk --clobber
