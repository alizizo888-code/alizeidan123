name: Rebrand articles to a new domain
on:
  workflow_dispatch:
    inputs:
      new_url:
        description: "الدومين الجديد (مثال https://example.com)"
        required: true
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/rebrand-domain.py "${{ github.event.inputs.new_url }}"
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Move articles to ${{ github.event.inputs.new_url }} and renumber slugs" || exit 0
          git push
