name: Trigger Oxygen WordPress cron

on:
  push:
    branches: [main]
    paths:
      - 'oxygen-ac-automation/**'
      - 'index.html'
      - 'articles/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/oxygen-wp-cron.yml'
      - '.htaccess'
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxygen-wp-cron
  cancel-in-progress: false

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository for article and sitemap smoke checks
        uses: actions/checkout@v7.0.1

      - name: Check that the live homepage is up (WordPress home page or legacy loader)
        shell: bash
        run: |
          set -euo pipefail
          ok=0; status=000
          for attempt in 1 2 3; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "https://oxygen11.com/?deployment_check=$(date +%s)" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && [[ "$(wc -c < "$body" | tr -d ' ')" -gt 3000 ]] && grep -qiE 'oxygen|أكسجين' "$body"; then
              ok=1; rm -f "$body"; break
            fi
            rm -f "$body"; sleep 10
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::Live homepage is not serving the Oxygen site (HTTP $status). Check Hostinger and the WordPress home page."
            exit 1
          fi
          echo "Live homepage OK (HTTP $status)."

      - name: Verify latest article pages and sitemap are publicly served
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY' > /tmp/oxygen-article-urls.txt
          import json
          from pathlib import Path
          rows = json.loads(Path("articles/catalog.json").read_text(encoding="utf-8"))
          rows = sorted(rows, key=lambda x: (x.get("published_at", ""), x.get("slug", "")), reverse=True)[:3]
          for row in rows:
              print("https://oxygen11.com/articles/" + row["slug"] + "/")
          PY
          while IFS= read -r url; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ ]] || [[ "$bytes" -lt 1500 ]] || ! grep -qi '<title>' "$body"; then
              echo "::warning::Static article page not served: $url (HTTP $status, $bytes bytes)"
            else
              echo "Article page OK: $url ($bytes bytes)."
            fi
            rm -f "$body"
          done < /tmp/oxygen-article-urls.txt

          # WordPress + Yoast serves a sitemap INDEX (sitemap_index.xml); the legacy static file is a urlset. Either is fine.
          found=0
          for u in https://oxygen11.com/sitemap_index.xml https://oxygen11.com/sitemap.xml https://oxygen11.com/wp-sitemap.xml; do
            sitemap="$(mktemp)"
            status="$(curl -sS -L --max-time 30 -o "$sitemap" -w '%{http_code}' "$u" || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && grep -qE '<urlset|<sitemapindex' "$sitemap"; then
              echo "Sitemap is publicly served: $u"; found=1; rm -f "$sitemap"; break
            fi
            rm -f "$sitemap"
          done
          if [[ "$found" -ne 1 ]]; then
            echo "::error::No sitemap is publicly served (sitemap_index.xml, sitemap.xml, wp-sitemap.xml)."
            exit 1
          fi

      - name: Diagnose WordPress admin and REST routes on googl subdomain
        shell: bash
        run: |
          set -euo pipefail
          check_route() {
            local path="$1"
            local label="$2"
            local body status ctype
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 20 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "https://googl.oxygen11.com$path" || true)"
            ctype="$(file -b --mime-type "$body" 2>/dev/null || echo unknown)"
            if [[ "$path" == "/" && "$status" =~ ^2[0-9][0-9]$ ]] && grep -qi 'أكسجين للصيانة والتبريد' "$body"; then
              echo "::warning::googl.oxygen11.com is serving the static Oxygen homepage at its root; verify that this subdomain points to the actual WordPress installation directory."
            elif [[ "$path" == "/wp-json/" ]]; then
              if [[ "$status" =~ ^2[0-9][0-9]$ ]] && head -c 2 "$body" | grep -Eq '\\{|\\['; then
                echo "WordPress REST route OK: $path (HTTP $status, $ctype)"
              else
                echo "::warning::WordPress REST route is not returning JSON: $path (HTTP $status, $ctype). Check the subdomain document root and WordPress core files."
              fi
            elif [[ "$status" =~ ^2[0-9][0-9]$ || "$status" =~ ^3[0-9][0-9]$ ]]; then
              if grep -qi 'أكسجين للصيانة والتبريد' "$body" && [[ "$path" == "/wp-login.php" || "$path" == "/wp-admin/" || "$path" == "/oxygen-admin/" ]]; then
                echo "::warning::WordPress path $path returned the static Oxygen homepage, not WordPress."
              else
                echo "WordPress route responded: $path (HTTP $status, $ctype)"
              fi
            else
              echo "::warning::WordPress route unavailable: $path (HTTP $status, $ctype). Check Hostinger subdomain document root / rewrite rules."
            fi
            rm -f "$body"
          }
          check_route "/" "subdomain homepage"
          check_route "/wp-login.php" "login"
          check_route "/wp-admin/" "admin"
          check_route "/wp-json/" "REST API"
          check_route "/wp-admin/admin.php?page=oxygen-ac-automation" "Oxygen publisher"
          check_route "/oxygen-admin/" "legacy admin portal"
      - name: Probe WordPress installation locations on both domains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local base="$1"
            local path="$2"
            local body status ctype verdict
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 15 -H 'Cache-Control: no-cache' -o "$body" -w '%{http_code}' "${base}${path}" || true)"
            ctype="$(file -b --mime-type "$body" 2>/dev/null || echo unknown)"
            verdict="not-WordPress"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]] && { head -c 1 "$body" | grep -Fq '{' || head -c 1 "$body" | grep -Fq '['; } && grep -Fq '"namespaces"' "$body"; then
              verdict="WordPress-REST-JSON"
            elif grep -qiE 'name="log"|id="loginform"|wp-login.php|WordPress' "$body" && [[ "$status" =~ ^2[0-9][0-9]$ || "$status" =~ ^3[0-9][0-9]$ ]]; then
              verdict="possible-WordPress-HTML"
            elif grep -qi 'أكسجين للصيانة والتبريد' "$body"; then
              verdict="static-Oxygen-page"
            fi
            printf '%s %-36s HTTP=%s type=%s result=%s bytes=%s\\n' "$base" "$path" "$status" "$ctype" "$verdict" "$(wc -c < "$body" | tr -d ' ')"
            rm -f "$body"
          }
          paths=(
            "/wp-json/"
            "/?rest_route=/"
            "/wp-login.php"
            "/wp-admin/"
            "/wordpress/wp-json/"
            "/wordpress/wp-login.php"
            "/wp/wp-json/"
            "/wp/wp-login.php"
            "/blog/wp-json/"
          )
          for base in "https://oxygen11.com" "https://googl.oxygen11.com"; do
            for path in "${paths[@]}"; do probe "$base" "$path"; done
          done
      - name: Trigger the WordPress cron on both sites (drives article publishing, refreshes and automation)
        shell: bash
        run: |
          set -uo pipefail
          trigger() {
            local url="$1" body status bytes
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 45 -o "$body" -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c < "$body" | tr -d ' ')"
            rm -f "$body"
            # wp-cron.php answers 200 with an empty body; any 2xx means WordPress booted and ran its due events.
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then echo "WordPress cron OK: $url (HTTP $status, $bytes bytes)"; return 0; fi
            echo "::warning::WordPress cron did not answer: $url (HTTP $status)"; return 1
          }
          main_ok=0
          trigger 'https://oxygen11.com/wp-cron.php?doing_wp_cron=1' && main_ok=1
          trigger 'https://mutqan.oxygen11.com/wp-cron.php?doing_wp_cron=1' || true
          if [[ "$main_ok" -ne 1 ]]; then
            echo "::error::oxygen11.com wp-cron.php is not answering. Check Hostinger (PHP errors, DISABLE_WP_CRON, security plugin blocking it)."
            exit 1
          fi
