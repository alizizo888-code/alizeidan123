name: Publish branch-specific SEO articles

on:
  # The daily schedule was removed: articles are now published by the WordPress plugin engine (60/day per stream, see the daily report).
  # This legacy workflow targets the old static-site branches `google` / `متقن`, which only exist in the old repositories.
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات لكل فرع في هذا التشغيل"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      generate_images:
        description: "إنشاء صور AI للمقالات (قد يستهلك رصيد API)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: branch-seo-article-publishing
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled/automatic runs belong to the repository wired to the live site; mirrors only run on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'alizizo888-code/alizeidan123' }}
    name: Publish ${{ matrix.branch }} articles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        branch: [google, متقن]
    steps:
      - name: Skip when the target branch does not exist in this repository
        id: br
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/${{ matrix.branch }}" >/dev/null 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Branch ${{ matrix.branch }} not found in this repository - skipped (articles are published by the WordPress plugin)."; fi

      - name: Checkout the target branch
        if: steps.br.outputs.ok == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.br.outputs.ok == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check site-specific publisher syntax
        if: steps.br.outputs.ok == 'true'
        run: python -m py_compile scripts/publish_static_articles.py

      - name: Validate existing site pages and sitemap
        if: steps.br.outputs.ok == 'true'
        run: python scripts/publish_static_articles.py --validate-only

      - name: Publish reviewed draft or generate a unique article
        if: steps.br.outputs.ok == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_GENERATE_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_images || 'false' }}
          ARTICLE_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || '1' }}
        run: python scripts/publish_static_articles.py --publish-queued "$ARTICLE_COUNT" --count "$ARTICLE_COUNT"

      - name: Commit articles only to their own branch
        if: steps.br.outputs.ok == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles sitemap.xml .github/article-queue
          if git diff --cached --quiet; then
            echo "No article changes to publish for $TARGET_BRANCH."
            exit 0
          fi
          git commit -m "content: publish site-specific SEO article batch"
          git push origin "HEAD:$TARGET_BRANCH"
