services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=https://evo.vps.oxygen11.com
      - AUTHENTICATION_API_KEY=${EVO_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evo:${EVO_DB_PASS}@evo-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=Oxygen
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - DEL_INSTANCE=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN
      - LOG_BAILEYS=error
      - LANGUAGE=en
      - TZ=Asia/Riyadh
    volumes:
      - evo_instances:/evolution/instances
    depends_on: [evo-db]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.evo.rule=Host(`evo.vps.oxygen11.com`)
      - traefik.http.routers.evo.entrypoints=web,websecure
      - traefik.http.routers.evo.tls=true
      - traefik.http.routers.evo.tls.certresolver=mytlschallenge
      - traefik.http.services.evo.loadbalancer.server.port=8080
    networks: [default, edge]
    mem_limit: 700m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  evo-db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evo
      - POSTGRES_PASSWORD=${EVO_DB_PASS}
    volumes:
      - evo_pg:/var/lib/postgresql/data
    mem_limit: 256m
  dl:
    image: busybox:latest
    restart: always
    command: ["sh", "-c", "mkdir -p /www/${DL_PATH} && base64 -d /mwc.b64 > /www/${DL_PATH}/mutqan-wa-center.zip && exec httpd -f -p 8080 -h /www"]
    configs:
      - source: mwc
        target: /mwc.b64
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.evodl.rule=Host(`evo.vps.oxygen11.com`) && PathPrefix(`/${DL_PATH}`)
      - traefik.http.routers.evodl.priority=100
      - traefik.http.routers.evodl.entrypoints=web,websecure
      - traefik.http.routers.evodl.tls=true
      - traefik.http.routers.evodl.tls.certresolver=mytlschallenge
      - traefik.http.services.evodl.loadbalancer.server.port=8080
    networks: [edge]
    mem_limit: 32m
