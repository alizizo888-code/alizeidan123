# «oxygen-blogger» on the VPS (Hostinger Docker Manager). Publishes the Blogger network through the Blogger API v3,
# every hour at :17, from the server only (owner order 2026-11-17). Code: public branch «blogger-vps» of alizeidan123.
# Keys are set in the project's environment in hPanel (never in this file):
#   BLOGGER_CLIENT_ID, BLOGGER_CLIENT_SECRET, BLOGGER_REFRESH_TOKEN   (account that owns the blogs)
#   GEMINI_API_KEY, GROQ_API_KEY                                     (optional: unique AI sections)
services:
  blogger:
    image: node:22-bookworm
    restart: unless-stopped
    environment:
      - BLOGGER_CLIENT_ID=${BLOGGER_CLIENT_ID}
      - BLOGGER_CLIENT_SECRET=${BLOGGER_CLIENT_SECRET}
      - BLOGGER_REFRESH_TOKEN=${BLOGGER_REFRESH_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TZ=UTC
    volumes:
      - data:/data
    command: >
      sh -c "([ -d /app/.git ] || git clone -q --depth 1 -b blogger-vps https://github.com/alizizo888-code/alizeidan123.git /app)
      && (git -C /app fetch -q --depth 1 origin blogger-vps && git -C /app reset -q --hard origin/blogger-vps || true)
      && exec bash /app/blogger/vps/loop.sh loop"
volumes:
  data: {}
