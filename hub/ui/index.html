<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الحسابات</title>
<style>:root{--bg:#f6f8fb;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--p:#0ea5e9;--ok:#16a34a;--w:#d97706;--bad:#dc2626}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--c:#111a2e;--t:#e5edf7;--m:#8aa0bd;--b:#22304a}}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}h1{font-size:20px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}
.pill{border-radius:99px;padding:1px 9px;font-size:12px;color:#fff;background:var(--m)}.active,.live{background:var(--ok)}.needs_login,.limited,.setup{background:var(--w)}.blocked{background:var(--bad)}
button,input,select{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t)}button{background:var(--p);color:#fff;border:0;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.k{color:var(--m)}</style>
<h1>مركز الحسابات والنشر</h1><div id=top class=card></div>
<h2>الحسابات</h2><div class=card><table id=acc></table><div class=row style=margin-top:10px><input id=lab placeholder="اسم الحساب (label)"><button onclick="link()">ربط حساب جوجل (OAuth)</button><span class=k>تفتح شاشة موافقة جوجل وتوافق بنفسك</span></div></div>
<h2>المواقع (بلوجر / ووردبريس / صفحات هبوط)</h2><div class=card><table id=sites></table></div>
<h2>خطوط الواتساب</h2><div class=card><table id=lines></table><div class=row style=margin-top:10px><textarea id=nums rows=3 placeholder="الصق الأرقام (سطر لكل رقم)" style="flex:1;min-width:200px"></textarea><textarea id=nms rows=3 placeholder="الصق الأسماء (سطر لكل اسم)" style="flex:1;min-width:200px"></textarea><button onclick="api('lines/import',{numbers:$('nums').value,names:$('nms').value}).then(load)">رفع</button><button onclick="api('lines/assign',{}).then(load)">توزيع عشوائي للأسماء والمواقع</button></div><small class=k id=lstat></small></div>
<h2>آخر الجولات</h2><div class=card><table id=runs></table></div>
<h2>مشاكل Search Console</h2><div class=card id=iss></div><h2>أحداث</h2><div class=card><table id=ev></table></div>
<script>
const $=id=>document.getElementById(id),api=(p,b)=>fetch('/api/'+p,b?{method:'POST',body:JSON.stringify(b)}:{}).then(r=>r.json()),pl=s=>`<span class="pill ${s}">${s}</span>`
let S;async function load(){S=await api('state');const m=S.mix,pc=(a,b)=>b?Math.round(100*a/b)+'%':'—'
$('top').innerHTML=`<div class=row><b>${S.day}</b><span>هدف اليوم: ${S.target}</span><span>تبريد/تكييف: ${pc(m.cooling,m.n)}</span><span>مكة: ${pc(m.makkah,m.n)}</span><span>${S.busy?'⏳ جولة '+S.busy:''}</span>
${['morning','noon','evening'].map(w=>`<button onclick="run('${w}')">تشغيل ${{morning:'الصباحية',noon:'الظهرية',evening:'المسائية'}[w]}</button>`).join('')}<button onclick="api('gsc',{}).then(load)">فحص Search Console</button><button onclick="api('report',{}).then(r=>alert(r.summary))">تقرير الآن</button></div>`
$('acc').innerHTML='<tr><th>الحساب<th>النوع<th>الحالة<th>مواقع<th>كتابات/ساعة<th>آخر نجاح<th>'+S.accounts.map(a=>`<tr><td>${a.label}<br><small class=k>${a.email||''}</small><td>${a.kind}/${a.auth}<td>${pl(a.status)}<td>${a.sites}<td>${a.writes1h}/15<td>${(a.last_ok_at||'').slice(0,16)}<td><button onclick="api('accounts/discover',{id:${a.id}}).then(load)">جلب مدوناته</button> <button onclick="api('accounts/status',{id:${a.id},status:'${a.status=='active'?'paused':'active'}'}).then(load)">${a.status=='active'?'إيقاف':'تفعيل'}</button>`).join('')
$('sites').innerHTML='<tr><th>الموقع<th>المنصة<th>الحالة<th>النمط<th>الحد اليومي<th>اليوم<th>الإجمالي<th>'+S.sites.map(s=>`<tr><td><a href="${s.url||'#'}" target=_blank>${s.slug}</a><td>${s.platform}<td>${pl(s.status)}<td><select onchange="api('sites/update',{id:${s.id},persona:this.value})">${Object.entries(S.personas).map(([k,v])=>`<option value=${k} ${k==s.persona?'selected':''}>${v}`).join('')}</select><td><input type=number min=0 max=6 value=${s.daily_cap} style=width:56px onchange="api('sites/update',{id:${s.id},daily_cap:+this.value})"><td>${s.today}<td>${s.posts}<td><button onclick="api('sites/update',{id:${s.id},status:'${s.status=='live'?'paused':'live'}'}).then(load)">${s.status=='live'?'إيقاف':'تشغيل'}</button>`).join('')
$('lines').innerHTML='<tr><th>الرقم<th>الاسم المعروض<th>الحالة<th>مواقع<th>'+S.lines.map(l=>`<tr><td dir=ltr>${l.number}<td>${l.display_name||'—'}<td>${pl(l.status)}<td>${l.sites}<td><button onclick="api('lines/update',{id:${l.id},status:'${l.status=='active'?'paused':'active'}'}).then(load)">${l.status=='active'?'إيقاف':'تفعيل'}</button>`).join('');$('lstat').textContent='أسماء في المخزن: '+S.names+' · وصفات مستخدمة: '+S.recipes.map(r=>r.p+' '+r.n).join('، ');
$('runs').innerHTML='<tr><th>اليوم<th>الجولة<th>نُشر<th>تبريد<th>مكة<th>حظر'+S.runs.map(r=>`<tr><td>${r.day}<td>${r.win}<td>${r.published}<td>${r.cooling}<td>${r.makkah}<td>${r.blocked?'⚠':''}`).join('')
$('iss').innerHTML=S.issues.length?S.issues.map(i=>`<div>${i.slug}: ${i.detail}</div>`).join(''):'<span class=k>لا مشاكل مفتوحة</span>'
$('ev').innerHTML=S.events.map(e=>`<tr><td>${e.at.slice(5,16)}<td>${e.level}<td>${e.msg}`).join('')}
function link(){location='/oauth/start?label='+encodeURIComponent($('lab').value)}
async function run(w){if(confirm('تشغيل الجولة '+w+'؟'))api('run',{win:w}).then(load);setTimeout(load,2000)}
load();setInterval(load,20000)</script></html>
