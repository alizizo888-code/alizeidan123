<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#0a0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="التحكم">
  <title>مركز التحكم</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="boot">جارٍ التحميل…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="pair" class="dialog">
    <form id="pair-form" method="dialog">
      <h2 id="pair-title">ربط الموقع</h2>
      <p class="muted">الصق المفتاح الظاهر في <strong>الإعدادات &gt; Oxygen Bridge</strong> داخل ووردبريس الخاص بالموقع.</p>
      <input id="pair-secret" class="field" type="password" autocomplete="off" spellcheck="false" dir="ltr" placeholder="64 حرفاً ورقماً" required>
      <p id="pair-err" class="err" role="alert"></p>
      <div class="row end">
        <button class="btn ghost" type="button" data-close>إلغاء</button>
        <button class="btn primary" type="submit">ربط</button>
      </div>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
